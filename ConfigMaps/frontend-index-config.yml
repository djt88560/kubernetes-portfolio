    class=\"result-badge\">\r\n✓\r\n</div>\r\n\r\n</div>\r\n\r\n\r\n<div class=\"result-divider\"></div>\r\n\r\n\r\n\r\n<!--
    RESULTS -->\r\n\r\n<div class=\"grades-section\">\r\n\r\n<h3>\r\nResults\r\n</h3>\r\n\r\n<div\r\nclass=\"grades-grid\"\r\nid=\"grades-container\"\r\n>\r\n\r\n</div>\r\n\r\n</div>\r\n\r\n\r\n\r\n<!--
    DESCRIPTION -->\r\n\r\n<div class=\"description-section\">\r\n\r\n<h3>\r\nAbout
    this qualification\r\n</h3>\r\n\r\n<p id=\"qualification-description\">\r\n</p>\r\n\r\n</div>\r\n\r\n\r\n</div>\r\n\r\n\r\n\r\n<!--
    =================================================\r\nERROR\r\n=================================================
    -->\r\n\r\n<div\r\nclass=\"error-panel\"\r\nid=\"error-panel\"\r\n>\r\n\r\n<div
    class=\"error-icon\">\r\n!\r\n</div>\r\n\r\n<h3>\r\nInformation unavailable\r\n</h3>\r\n\r\n<p
    id=\"error-message\">\r\nUnable to load this information.\r\n</p>\r\n\r\n<button\r\nclass=\"retry-button\"\r\nid=\"retry-button\"\r\n>\r\nTry
    Again\r\n</button>\r\n\r\n</div>\r\n\r\n\r\n</section>\r\n\r\n</section>\r\n\r\n</main>\r\n\r\n\r\n\r\n<!--
    =====================================================\r\nFOOTER\r\n=====================================================
    -->\r\n\r\n<footer>\r\n\r\n<span>\r\n© 2026 Dan Jackson-Thomas\r\n</span>\r\n\r\n<span>\r\nPersonal
    Portfolio\r\n</span>\r\n\r\n</footer>\r\n\r\n\r\n\r\n<!-- =====================================================\r\nJAVASCRIPT\r\n=====================================================
    -->\r\n\r\n<script>\r\n\r\n\r\n/*\r\n* HTML elements\r\n*/\r\n\r\nconst loadingPanel
    =\r\ndocument.getElementById(\"loading\");\r\n\r\nconst resultPanel =\r\ndocument.getElementById(\"qualification-result\");\r\n\r\nconst
    errorPanel =\r\ndocument.getElementById(\"error-panel\");\r\n\r\nconst titleElement
    =\r\ndocument.getElementById(\"qualification-title\");\r\n\r\nconst gradesContainer
    =\r\ndocument.getElementById(\"grades-container\");\r\n\r\nconst descriptionElement
    =\r\ndocument.getElementById(\r\n\"qualification-description\"\r\n);\r\n\r\nconst
    errorMessage =\r\ndocument.getElementById(\"error-message\");\r\n\r\nconst retryButton
    =\r\ndocument.getElementById(\"retry-button\");\r\n\r\n\r\n/*\r\n* Remember the
    currently selected qualification.\r\n*/\r\n\r\nlet currentQualification = \"A-Levels\";\r\n\r\n\r\n\r\n/*\r\n*
    Load qualification information.\r\n*/\r\n\r\nasync function loadQualification(\r\nqualification,\r\nclickedButton
    = null\r\n) {\r\n\r\ncurrentQualification = qualification;\r\n\r\n\r\n/*\r\n*
    Update selected button.\r\n*/\r\n\r\nif (clickedButton) {\r\n\r\ndocument\r\n.querySelectorAll(\r\n\".qualification-button\"\r\n)\r\n.forEach(button
    => {\r\n\r\nbutton.classList.remove(\"active\");\r\n\r\n});\r\n\r\nclickedButton.classList.add(\"active\");\r\n}\r\n\r\n\r\n/*\r\n*
    Show loading state.\r\n*/\r\n\r\nloadingPanel.style.display = \"flex\";\r\n\r\nresultPanel.style.display
    = \"none\";\r\n\r\nerrorPanel.style.display = \"none\";\r\n\r\n\r\ntry {\r\n\r\n\r\n/*\r\n*
    Build API endpoint.\r\n*\r\n* A-Levels -> /api/A-Levels\r\n* GCSEs -> /api/GCSEs\r\n*
    etc.\r\n*/\r\n\r\nconst endpoint =\r\n\"/api/\" +\r\nencodeURIComponent(\r\nqualification\r\n);\r\n\r\n\r\n/*\r\n*
    Call backend.\r\n*/\r\n\r\nconst response =\r\nawait fetch(endpoint);\r\n\r\n\r\n/*\r\n*
    Check HTTP response.\r\n*/\r\n\r\nif (!response.ok) {\r\n\r\nthrow new Error(\r\n`Server
    returned ${response.status}`\r\n);\r\n\r\n}\r\n\r\n\r\n/*\r\n* Convert response
    to JSON.\r\n*/\r\n\r\nconst data =\r\nawait response.json();\r\n\r\nconsole.log(\"Received
    data:\", data);\r\n\r\n/*\r\n* Set title.\r\n*\r\n* If the backend supplies a
    title,\r\n* use it. Otherwise use the selected\r\n* qualification name.\r\n*/\r\n\r\ntitleElement.textContent
    =\r\ndata.title ||\r\nqualification;\r\n\r\n\r\n\r\n/*\r\n* Set description.\r\n*/\r\n\r\ndescriptionElement.textContent
    =\r\ndata.description ||\r\n\"No description has been provided yet.\";\r\n\r\n\r\n\r\n/*\r\n*
    Clear old grades.\r\n*/\r\n\r\ngradesContainer.innerHTML = \"\";\r\n\r\n\r\n\r\n/*\r\n*
    Your current database stores grades\r\n* as VARCHAR, so we expect something like:\r\n*\r\n*
    \"A,A,B\"\r\n*\r\n* or:\r\n*\r\n* \"A, A, B\"\r\n*/\r\n\r\nif (data.grades) {\r\n\r\n\r\nconst
    grades =\r\nString(data.grades)\r\n.split(\",\")\r\n.map(\r\ngrade =>\r\ngrade.trim()\r\n)\r\n.filter(\r\ngrade
    =>\r\ngrade.length > 0\r\n);\r\n\r\n\r\n/*\r\n* Create a card for each grade.\r\n*/\r\n\r\ngrades.forEach(\r\n(grade,
    index) => {\r\n\r\n\r\nconst gradeCard =\r\ndocument.createElement(\r\n\"div\"\r\n);\r\n\r\ngradeCard.className
    =\r\n\"grade-card\";\r\n\r\n\r\nconst subject =\r\ndocument.createElement(\r\n\"span\"\r\n);\r\n\r\nsubject.className
    =\r\n\"subject\";\r\n\r\n\r\n/*\r\n* At the moment your database\r\n* only stores
    the grades, not\r\n* subject names.\r\n*\r\n* Therefore we call these\r\n* Result
    1, Result 2, etc.\r\n*\r\n* You can change this later\r\n* if you add subject
    names.\r\n*/\r\n\r\nsubject.textContent =\r\n`Result ${index + 1}`;\r\n\r\n\r\nconst
    gradeValue =\r\ndocument.createElement(\r\n\"strong\"\r\n);\r\n\r\ngradeValue.className
    =\r\n\"grade\";\r\n\r\ngradeValue.textContent =\r\ngrade;\r\n\r\n\r\ngradeCard.appendChild(\r\nsubject\r\n);\r\n\r\ngradeCard.appendChild(\r\ngradeValue\r\n);\r\n\r\n\r\ngradesContainer.appendChild(\r\ngradeCard\r\n);\r\n\r\n}\r\n);\r\n\r\n\r\n}
    else {\r\n\r\n\r\ngradesContainer.innerHTML = `\r\n<p class=\"no-data\">\r\nNo
    results have been added yet.\r\n</p>\r\n`;\r\n\r\n}\r\n\r\n\r\n\r\n/*\r\n* Finished
    loading.\r\n*/\r\n\r\nloadingPanel.style.display =\r\n\"none\";\r\n\r\nresultPanel.style.display
    =\r\n\"block\";\r\n\r\n\r\n} catch (error) {\r\n\r\n\r\n/*\r\n* Something went
    wrong.\r\n*/\r\n\r\nconsole.error(\r\n\"Qualification error:\",\r\nerror\r\n);\r\n\r\n\r\nloadingPanel.style.display
    =\r\n\"none\";\r\n\r\nresultPanel.style.display =\r\n\"none\";\r\n\r\nerrorPanel.style.display
    =\r\n\"block\";\r\n\r\n\r\nerrorMessage.textContent =\r\n\"Unable to load \" +\r\nqualification
    +\r\n\". \" +\r\nerror.message;\r\n\r\n\r\n/*\r\n* Set retry action.\r\n*/\r\n\r\nretryButton.onclick
    =\r\nfunction () {\r\n\r\nloadQualification(\r\ncurrentQualification\r\n);\r\n\r\n};\r\n\r\n}\r\n\r\n}\r\n\r\n\r\n\r\n/*\r\n*
    Automatically load A-Levels\r\n* when the page opens.\r\n*/\r\n\r\ndocument.addEventListener(\r\n\"DOMContentLoaded\",\r\nfunction
    () {\r\n\r\nloadQualification(\r\n\"A-Levels\"\r\n);\r\n\r\n}\r\n);\r\n\r\n</script>\r\n\r\n</body>\r\n\r\n\r\n</html>"
  styles.css: "/* =========================================================\r\nVARIABLES\r\n=========================================================
    */\r\n\r\n:root {\r\n\r\n--navy: #142463;\r\n--navy-dark: #0b1435;\r\n\r\n--teal:
