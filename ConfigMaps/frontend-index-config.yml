  career.html: "<!DOCTYPE html>\r\n<html lang=\"en\">\r\n\r\n<head>\r\n\r\n<meta charset=\"UTF-8\">\r\n\r\n<meta\r\nname=\"viewport\"\r\ncontent=\"width=device-width,
    initial-scale=1.0\"\r\n>\r\n\r\n<title>\r\nCareer | Dan Jackson-Thomas\r\n</title>\r\n\r\n<link
    rel=\"stylesheet\" href=\"styles.css\">\r\n\r\n</head>\r\n\r\n\r\n<body>\r\n\r\n\r\n<!--
    =====================================================\r\nNAVIGATION\r\n=====================================================
    -->\r\n\r\n<header class=\"navbar\">\r\n\r\n<div class=\"navbar-container\">\r\n\r\n<a
    href=\"index.html\" class=\"logo\">\r\nDJT\r\n</a>\r\n\r\n<span class=\"navbar-name\">\r\nDan
    Jackson-Thomas\r\n</span>\r\n\r\n<a href=\"index.html\" class=\"back-button\">\r\n←
    Back to Portfolio\r\n</a>\r\n\r\n</div>\r\n\r\n</header>\r\n\r\n\r\n\r\n<main>\r\n\r\n\r\n<!--
    =====================================================\r\nPAGE HEADER\r\n=====================================================
    -->\r\n\r\n<section class=\"page-header\">\r\n\r\n<div class=\"page-header-content\">\r\n\r\n<p
    class=\"eyebrow\">\r\nMY CAREER\r\n</p>\r\n\r\n<h1>\r\nGraduate Scheme<br>\r\n<span>Journey</span>\r\n</h1>\r\n\r\n<p>\r\nExplore
    the different rotations I have completed\r\nthroughout my graduate scheme and
    find out more\r\nabout the experience I gained from each one.\r\n</p>\r\n\r\n</div>\r\n\r\n</section>\r\n\r\n\r\n\r\n<!--
    =====================================================\r\nROTATIONS\r\n=====================================================
    -->\r\n\r\n<section class=\"career-container\">\r\n\r\n\r\n<div class=\"section-heading\">\r\n\r\n<p
    class=\"eyebrow\">\r\nGRADUATE SCHEME\r\n</p>\r\n\r\n<h2>\r\nMy Rotations\r\n</h2>\r\n\r\n<p>\r\nSelect
    a rotation below to find out more about\r\nmy experience, responsibilities and
    achievements.\r\n</p>\r\n\r\n</div>\r\n\r\n\r\n\r\n<!-- =================================================\r\nROTATION
    CARDS\r\n================================================= -->\r\n\r\n<div class=\"rotation-grid\">\r\n\r\n\r\n<!--
    ROTATION 1 -->\r\n\r\n<button\r\nclass=\"rotation-card active\"\r\nonclick=\"loadRotation(1,
    this)\"\r\n>\r\n\r\n<div class=\"rotation-number\">\r\n01\r\n</div>\r\n\r\n<div
    class=\"rotation-icon\">\r\n1\r\n</div>\r\n\r\n<h3>\r\nRotation 1\r\n</h3>\r\n\r\n<p>\r\nMy
    first graduate scheme rotation.\r\n</p>\r\n\r\n<span class=\"rotation-arrow\">\r\n→\r\n</span>\r\n\r\n</button>\r\n\r\n\r\n\r\n<!--
    ROTATION 2 -->\r\n\r\n<button\r\nclass=\"rotation-card\"\r\nonclick=\"loadRotation(2,
    this)\"\r\n>\r\n\r\n<div class=\"rotation-number\">\r\n02\r\n</div>\r\n\r\n<div
    class=\"rotation-icon\">\r\n2\r\n</div>\r\n\r\n<h3>\r\nRotation 2\r\n</h3>\r\n\r\n<p>\r\nMy
    second graduate scheme rotation.\r\n</p>\r\n\r\n<span class=\"rotation-arrow\">\r\n→\r\n</span>\r\n\r\n</button>\r\n\r\n\r\n\r\n<!--
    ROTATION 3 -->\r\n\r\n<button\r\nclass=\"rotation-card\"\r\nonclick=\"loadRotation(3,
    this)\"\r\n>\r\n\r\n<div class=\"rotation-number\">\r\n03\r\n</div>\r\n\r\n<div
    class=\"rotation-icon\">\r\n3\r\n</div>\r\n\r\n<h3>\r\nRotation 3\r\n</h3>\r\n\r\n<p>\r\nMy
    third graduate scheme rotation.\r\n</p>\r\n\r\n<span class=\"rotation-arrow\">\r\n→\r\n</span>\r\n\r\n</button>\r\n\r\n</div>\r\n\r\n\r\n\r\n<!--
    =================================================\r\nROTATION INFORMATION\r\n=================================================
    -->\r\n\r\n<div class=\"rotation-result\" id=\"rotation-result\">\r\n\r\n\r\n<!--
    Loading -->\r\n\r\n<div\r\nclass=\"career-loading\"\r\nid=\"career-loading\"\r\n>\r\n\r\n<div
    class=\"loading-spinner\"></div>\r\n\r\n<span>\r\nLoading rotation...\r\n</span>\r\n\r\n</div>\r\n\r\n\r\n\r\n<!--
    Content -->\r\n\r\n<div\r\nid=\"rotation-content\"\r\nstyle=\"display: none;\"\r\n>\r\n\r\n<div
    class=\"rotation-result-header\">\r\n\r\n<div>\r\n\r\n<p class=\"result-category\">\r\nGRADUATE
    SCHEME ROTATION\r\n</p>\r\n\r\n<h2 id=\"rotation-title\">\r\nRotation 1\r\n</h2>\r\n\r\n</div>\r\n\r\n<div\r\nclass=\"rotation-result-number\"\r\nid=\"rotation-number\"\r\n>\r\n01\r\n</div>\r\n\r\n</div>\r\n\r\n\r\n<div
    class=\"result-divider\"></div>\r\n\r\n\r\n<div class=\"rotation-description\">\r\n\r\n<h3>\r\nAbout
    this rotation\r\n</h3>\r\n\r\n<p id=\"rotation-description\">\r\n</p>\r\n\r\n</div>\r\n\r\n\r\n</div>\r\n\r\n\r\n\r\n<!--
    Error -->\r\n\r\n<div\r\nclass=\"career-error\"\r\nid=\"career-error\"\r\n>\r\n\r\n<div
    class=\"error-icon\">\r\n!\r\n</div>\r\n\r\n<h3>\r\nUnable to load rotation\r\n</h3>\r\n\r\n<p
    id=\"career-error-message\">\r\nThere was a problem retrieving this\r\nrotation.\r\n</p>\r\n\r\n<button\r\nclass=\"retry-button\"\r\nid=\"career-retry\"\r\n>\r\nTry
    Again\r\n</button>\r\n\r\n</div>\r\n\r\n</div>\r\n\r\n</section>\r\n\r\n</main>\r\n\r\n\r\n\r\n<!--
    =====================================================\r\nFOOTER\r\n=====================================================
    -->\r\n\r\n<footer>\r\n\r\n<span>\r\n© 2026 Dan Jackson-Thomas\r\n</span>\r\n\r\n<span>\r\nPersonal
    Portfolio\r\n</span>\r\n\r\n</footer>\r\n\r\n\r\n\r\n<!-- =====================================================\r\nJAVASCRIPT\r\n=====================================================
    -->\r\n\r\n<script>\r\n\r\n\r\n/*\r\n* HTML elements\r\n*/\r\n\r\nconst loading
    =\r\ndocument.getElementById(\r\n\"career-loading\"\r\n);\r\n\r\nconst content
    =\r\ndocument.getElementById(\r\n\"rotation-content\"\r\n);\r\n\r\nconst error
    =\r\ndocument.getElementById(\r\n\"career-error\"\r\n);\r\n\r\nconst title =\r\ndocument.getElementById(\r\n\"rotation-title\"\r\n);\r\n\r\nconst
    description =\r\ndocument.getElementById(\r\n\"rotation-description\"\r\n);\r\n\r\nconst
    rotationNumber =\r\ndocument.getElementById(\r\n\"rotation-number\"\r\n);\r\n\r\nconst
    errorMessage =\r\ndocument.getElementById(\r\n\"career-error-message\"\r\n);\r\n\r\nconst
    retryButton =\r\ndocument.getElementById(\r\n\"career-retry\"\r\n);\r\n\r\n\r\n/*\r\n*
    Keep track of the selected rotation.\r\n*/\r\n\r\nlet currentRotation = 1;\r\n\r\n\r\n\r\n/*\r\n*
    Load a rotation from the backend.\r\n*/\r\n\r\nasync function loadRotation(\r\nrotationId,\r\nclickedButton
    = null\r\n) {\r\n\r\ncurrentRotation = rotationId;\r\n\r\n\r\n/*\r\n* Update the
    selected card.\r\n*/\r\n\r\nif (clickedButton) {\r\n\r\ndocument\r\n.querySelectorAll(\r\n\".rotation-card\"\r\n)\r\n.forEach(card
    => {\r\n\r\ncard.classList.remove(\r\n\"active\"\r\n);\r\n\r\n});\r\n\r\nclickedButton.classList.add(\r\n\"active\"\r\n);\r\n\r\n}\r\n\r\n\r\n\r\n/*\r\n*
    Show loading state.\r\n*/\r\n\r\nloading.style.display = \"flex\";\r\n\r\ncontent.style.display
    = \"none\";\r\n\r\nerror.style.display = \"none\";\r\n\r\n\r\n\r\ntry {\r\n\r\n\r\n/*\r\n*
    Call the appropriate API endpoint.\r\n*\r\n* Rotation 1:\r\n* /api/career/rotation-1\r\n*\r\n*
    Rotation 2:\r\n* /api/career/rotation-2\r\n*\r\n* Rotation 3:\r\n* /api/career/rotation-3\r\n*/\r\n\r\nconst
    response =\r\nawait fetch(\r\n`/api/rotation-${rotationId}`\r\n);\r\n\r\n\r\n\r\n/*\r\n*
    Check that the request succeeded.\r\n*/\r\n\r\nif (!response.ok) {\r\n\r\nthrow
    new Error(\r\n`Server returned ${response.status}`\r\n);\r\n\r\n}\r\n\r\n\r\n\r\n/*\r\n*
    Convert response to JSON.\r\n*/\r\n\r\nconst data =\r\nawait response.json();\r\n\r\n\r\n\r\n/*\r\n*
    Populate the page.\r\n*/\r\n\r\ntitle.textContent =\r\ndata.title ||\r\n`Rotation
    ${rotationId}`;\r\n\r\n\r\ndescription.textContent =\r\ndata.description ||\r\n\"No
    description has been added yet.\";\r\n\r\n\r\nrotationNumber.textContent =\r\nString(rotationId)\r\n.padStart(2,
    \"0\");\r\n\r\n\r\n\r\n/*\r\n* Hide loading and show result.\r\n*/\r\n\r\nloading.style.display
    =\r\n\"none\";\r\n\r\ncontent.style.display =\r\n\"block\";\r\n\r\n\r\n\r\n} catch
    (err) {\r\n\r\n\r\n/*\r\n* Show error message.\r\n*/\r\n\r\nconsole.error(\r\n\"Career
    API error:\",\r\nerr\r\n);\r\n\r\n\r\nloading.style.display =\r\n\"none\";\r\n\r\ncontent.style.display
    =\r\n\"none\";\r\n\r\nerror.style.display =\r\n\"block\";\r\n\r\n\r\nerrorMessage.textContent
    =\r\n`Unable to load Rotation ${rotationId}. `\r\n+ err.message;\r\n\r\n\r\n\r\n/*\r\n*
    Allow the user to try again.\r\n*/\r\n\r\nretryButton.onclick =\r\nfunction ()
    {\r\n\r\nloadRotation(\r\ncurrentRotation\r\n);\r\n\r\n};\r\n\r\n}\r\n\r\n}\r\n\r\n\r\n\r\n/*\r\n*
    Load Rotation 1 when the page first opens.\r\n*/\r\n\r\ndocument.addEventListener(\r\n\"DOMContentLoaded\",\r\nfunction
    () {\r\n\r\nloadRotation(1);\r\n\r\n}\r\n);\r\n\r\n</script>\r\n\r\n\r\n\r\n<!--
    =====================================================\r\nCAREER-SPECIFIC STYLES\r\n=====================================================
    -->\r\n\r\n<style>\r\n\r\n\r\n/* =====================================================\r\nCAREER
    CONTAINER\r\n===================================================== */\r\n\r\n.career-container
    {\r\n\r\nmax-width: 1200px;\r\n\r\nmargin: 0 auto;\r\n\r\npadding:\r\n60px 30px
    100px;\r\n\r\n}\r\n\r\n\r\n\r\n/* =====================================================\r\nROTATION
    GRID\r\n===================================================== */\r\n\r\n.rotation-grid
    {\r\n\r\ndisplay: grid;\r\n\r\ngrid-template-columns:\r\nrepeat(\r\n3,\r\nminmax(0,
    1fr)\r\n);\r\n\r\ngap: 20px;\r\n\r\nmargin-top: 35px;\r\n\r\n}\r\n\r\n\r\n\r\n/*
    =====================================================\r\nROTATION CARD\r\n=====================================================
    */\r\n\r\n.rotation-card {\r\n\r\nposition: relative;\r\n\r\nmin-height: 245px;\r\n\r\npadding:
    28px;\r\n\r\noverflow: hidden;\r\n\r\nborder:\r\n1px solid var(--border);\r\n\r\nborder-radius:
    20px;\r\n\r\nbackground: white;\r\n\r\ncolor: var(--text);\r\n\r\ntext-align:
    left;\r\n\r\ncursor: pointer;\r\n\r\nbox-shadow:\r\n0 8px 25px\r\nrgba(20, 36,
    99, 0.05);\r\n\r\ntransition:\r\ntransform 0.25s ease,\r\nbox-shadow 0.25s ease,\r\nbackground
    0.25s ease,\r\ncolor 0.25s ease;\r\n\r\n}\r\n\r\n\r\n\r\n.rotation-card:hover
    {\r\n\r\ntransform:\r\ntranslateY(-6px);\r\n\r\nbox-shadow:\r\nvar(--shadow);\r\n\r\n}\r\n\r\n\r\n\r\n.rotation-card.active
    {\r\n\r\nbackground:\r\nvar(--gradient);\r\n\r\ncolor: white;\r\n\r\nborder-color:\r\ntransparent;\r\n\r\nbox-shadow:\r\n0
    15px 35px\r\nrgba(17, 141, 156, 0.25);\r\n\r\n}\r\n\r\n\r\n\r\n.rotation-number
    {\r\n\r\nposition: absolute;\r\n\r\ntop: 22px;\r\n\r\nright: 25px;\r\n\r\ncolor:
    #dce2ec;\r\n\r\nfont-size: 12px;\r\n\r\nfont-weight: 800;\r\n\r\nletter-spacing:
    1px;\r\n\r\n}\r\n\r\n\r\n\r\n.rotation-card.active\r\n.rotation-number {\r\n\r\ncolor:\r\nrgba(255,
    255, 255, 0.35);\r\n\r\n}\r\n\r\n\r\n\r\n.rotation-icon {\r\n\r\nwidth: 50px;\r\n\r\nheight:
    50px;\r\n\r\ndisplay: flex;\r\n\r\nalign-items: center;\r\n\r\njustify-content:
    center;\r\n\r\nmargin-bottom: 25px;\r\n\r\nborder-radius: 14px;\r\n\r\nbackground:\r\n#eef7f8;\r\n\r\ncolor:
    var(--teal);\r\n\r\nfont-size: 20px;\r\n\r\nfont-weight: 800;\r\n\r\n}\r\n\r\n\r\n\r\n.rotation-card.active\r\n.rotation-icon
    {\r\n\r\nbackground:\r\nrgba(255, 255, 255, 0.15);\r\n\r\ncolor: white;\r\n\r\n}\r\n\r\n\r\n\r\n.rotation-card
    h3 {\r\n\r\nmargin-bottom: 9px;\r\n\r\nfont-size: 23px;\r\n\r\n}\r\n\r\n\r\n\r\n.rotation-card
    p {\r\n\r\nmargin-bottom: 0;\r\n\r\ncolor: var(--muted);\r\n\r\nfont-size: 14px;\r\n\r\nline-height:
    1.6;\r\n\r\n}\r\n\r\n\r\n\r\n.rotation-card.active p {\r\n\r\ncolor:\r\nrgba(255,
    255, 255, 0.75);\r\n\r\n}\r\n\r\n\r\n\r\n.rotation-arrow {\r\n\r\nposition: absolute;\r\n\r\nbottom:
    25px;\r\n\r\nright: 27px;\r\n\r\nfont-size: 20px;\r\n\r\ntransition:\r\ntransform
    0.2s ease;\r\n\r\n}\r\n\r\n\r\n\r\n.rotation-card:hover\r\n.rotation-arrow {\r\n\r\ntransform:\r\ntranslateX(5px);\r\n\r\n}\r\n\r\n\r\n\r\n/*
    =====================================================\r\nRESULT PANEL\r\n=====================================================
    */\r\n\r\n.rotation-result {\r\n\r\nmin-height: 350px;\r\n\r\nmargin-top: 30px;\r\n\r\npadding:
    35px;\r\n\r\nbackground: white;\r\n\r\nborder:\r\n1px solid var(--border);\r\n\r\nborder-radius:
    20px;\r\n\r\nbox-shadow:\r\nvar(--shadow);\r\n\r\n}\r\n\r\n\r\n\r\n.rotation-result-header
    {\r\n\r\ndisplay: flex;\r\n\r\nalign-items: center;\r\n\r\njustify-content: space-between;\r\n\r\ngap:
    20px;\r\n\r\n}\r\n\r\n\r\n\r\n.rotation-result-header h2 {\r\n\r\nmargin: 0;\r\n\r\ncolor:
    var(--navy);\r\n\r\nfont-size: 36px;\r\n\r\nletter-spacing: -1px;\r\n\r\n}\r\n\r\n\r\n\r\n.rotation-result-number
    {\r\n\r\nwidth: 60px;\r\n\r\nheight: 60px;\r\n\r\ndisplay: flex;\r\n\r\nalign-items:
    center;\r\n\r\njustify-content: center;\r\n\r\nflex-shrink: 0;\r\n\r\nborder-radius:
    17px;\r\n\r\nbackground:\r\nvar(--gradient);\r\n\r\ncolor: white;\r\n\r\nfont-size:
    18px;\r\n\r\nfont-weight: 800;\r\n\r\n}\r\n\r\n\r\n\r\n.rotation-description {\r\n\r\nmax-width:
    850px;\r\n\r\n}\r\n\r\n\r\n\r\n.rotation-description h3 {\r\n\r\nmargin-bottom:
    15px;\r\n\r\ncolor: var(--navy);\r\n\r\nfont-size: 17px;\r\n\r\n}\r\n\r\n\r\n\r\n.rotation-description
    p {\r\n\r\ncolor: #566178;\r\n\r\nfont-size: 17px;\r\n\r\nline-height: 1.8;\r\n\r\nwhite-space:
    pre-wrap;\r\n\r\n}\r\n\r\n\r\n\r\n/* =====================================================\r\nLOADING\r\n=====================================================
    */\r\n\r\n.career-loading {\r\n\r\nmin-height: 280px;\r\n\r\ndisplay: flex;\r\n\r\nalign-items:
    center;\r\n\r\njustify-content: center;\r\n\r\ncolor: var(--muted);\r\n\r\n}\r\n\r\n\r\n\r\n.loading-spinner
    {\r\n\r\nwidth: 22px;\r\n\r\nheight: 22px;\r\n\r\nmargin-right: 12px;\r\n\r\nborder:\r\n3px
    solid #dce5eb;\r\n\r\nborder-top-color:\r\nvar(--teal);\r\n\r\nborder-radius:
    50%;\r\n\r\nanimation:\r\ncareer-spin 0.8s linear infinite;\r\n\r\n}\r\n\r\n\r\n\r\n@keyframes
    career-spin {\r\n\r\nto {\r\n\r\ntransform:\r\nrotate(360deg);\r\n\r\n}\r\n\r\n}\r\n\r\n\r\n\r\n/*
    =====================================================\r\nERROR\r\n=====================================================
    */\r\n\r\n.career-error {\r\n\r\ndisplay: none;\r\n\r\nmin-height: 280px;\r\n\r\npadding:
    40px;\r\n\r\ntext-align: center;\r\n\r\n}\r\n\r\n\r\n\r\n.career-error h3 {\r\n\r\ncolor:
    var(--navy);\r\n\r\n}\r\n\r\n\r\n\r\n.career-error p {\r\n\r\ncolor: var(--muted);\r\n\r\nline-height:
    1.6;\r\n\r\n}\r\n\r\n\r\n\r\n/* =====================================================\r\nRESPONSIVE\r\n=====================================================
    */\r\n\r\n@media (max-width: 800px) {\r\n\r\n.rotation-grid {\r\n\r\ngrid-template-columns:
    1fr;\r\n\r\n}\r\n\r\n.rotation-card {\r\n\r\nmin-height: 190px;\r\n\r\n}\r\n\r\n}\r\n\r\n\r\n\r\n@media
    (max-width: 600px) {\r\n\r\n.career-container {\r\n\r\npadding-left: 20px;\r\n\r\npadding-right:
    20px;\r\n\r\n}\r\n\r\n.rotation-result {\r\n\r\npadding: 25px;\r\n\r\n}\r\n\r\n.rotation-result-header
    h2 {\r\n\r\nfont-size: 29px;\r\n\r\n}\r\n\r\n}\r\n\r\n</style>\r\n\r\n</body>\r\n\r\n</html>"
  education.html: "<!DOCTYPE html>\r\n<html lang=\"en\">\r\n\r\n<head>\r\n\r\n    <meta
    charset=\"UTF-8\">\r\n\r\n    <meta\r\n        name=\"viewport\"\r\n        content=\"width=device-width,
    initial-scale=1.0\"\r\n    >\r\n\r\n    <title>\r\n        Education | Dan Jackson-Thomas\r\n
    \   </title>\r\n\r\n    <link rel=\"stylesheet\" href=\"styles.css\">\r\n\r\n</head>\r\n\r\n<body>\r\n\r\n
    \   <!-- =====================================================\r\n    NAVIGATION\r\n
    \   ===================================================== -->\r\n\r\n    <header
    class=\"navbar\">\r\n\r\n        <div class=\"navbar-container\">\r\n\r\n            <a
    href=\"index.html\" class=\"logo\">\r\n                DJT\r\n            </a>\r\n\r\n
    \           <span class=\"navbar-name\">\r\n                Dan Jackson-Thomas\r\n
    \           </span>\r\n\r\n            <a href=\"index.html\" class=\"back-button\">\r\n
    \               ← Back to Portfolio\r\n            </a>\r\n\r\n        </div>\r\n\r\n
    \   </header>\r\n\r\n    <main>\r\n\r\n        <!-- =====================================================\r\n
    \       PAGE HEADER\r\n        =====================================================
    -->\r\n\r\n        <section class=\"page-header\">\r\n\r\n            <div class=\"page-header-content\">\r\n\r\n
    \               <p class=\"eyebrow\">\r\n                    MY EDUCATION\r\n
    \               </p>\r\n\r\n                <h1>\r\n                    Academic\r\n
    \                   <br>\r\n                    <span>Journey</span>\r\n                </h1>\r\n\r\n
    \               <p>\r\n                    Explore my educational background,
    academic\r\n                    achievements and the qualifications that have\r\n
    \                   supported my professional development.\r\n                </p>\r\n\r\n
    \           </div>\r\n\r\n        </section>\r\n\r\n        <!-- =====================================================\r\n
    \       EDUCATION\r\n        =====================================================
    -->\r\n\r\n        <section class=\"career-container\">\r\n\r\n            <div
    class=\"section-heading\">\r\n\r\n                <p class=\"eyebrow\">\r\n                    EDUCATION\r\n
    \               </p>\r\n\r\n                <h2>\r\n                    Educational
    Background\r\n                </h2>\r\n\r\n                <p>\r\n                    A
