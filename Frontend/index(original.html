<style>
    /* Method 1: Absolute Positioning */
    .absolute-btn {
        position: absolute; /* Position relative to nearest positioned ancestor */
        top: 50px;          /* Distance from top */
        left: 100px;        /* Distance from left */
        padding: 48px 40px;
        width: 100px;
        height: 100px;

        text-align: center; /* Horizontal centering */
        display: flex;
        align-items: center; /* Vertical centering */
        justify-content: center;

        background-color: #007BFF;
        color: white;
        border: none;
        cursor: pointer;
    }
</style>

<head>

</head>
