<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dan Jackson-Thomas Portfolio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
            background-color: #f5f5f5;
        }

        h1 {
            font0s
            margin-bottom: 2rem;
        }

        .container {
            display: flex;
            gap: 2rem;
            align-items: flex-start;
        }

        .profile-image {
            width: 500px;
            max-width: 100%;
            height: auto;
            border-radius: 12px;
        }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #142463, #118D9C);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            width: 200px;
        }

        .btn:hover {
            background: linear-gradient(135deg, #118D9C, #142463);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .content-panel {
            background: linear-gradient(145deg, #118D9C, #142463);
            color: #f8fafc;
            border-radius: 20px;
            padding: 1.5rem;
            width: 500px;
            min-height: 300px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 40px rgba(0,0,0,0.35);
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>My Qualifications and Awards</h1>

    <div class="container">

        <img src="images/Dan_Jackson_Thomas.jpg"
            alt="A description of my photo"
            style="width:50vw; height:50vh">

        <div class="right-column">

            <button class="btn" onclick="callALevels()">
                A-Levels
            </button>

            <div class="content-panel" id="content-panel">
                Click the button to load qualifications.
            </div>

        </div>

    </div>

    <script>
        async function callALevels() {
            try {
                const res = await fetch("/api/A-Levels");
                const data = await res.json();

                const textbox = document.getElementById("content-panel");
                textbox.textContent = JSON.stringify(data, null, 2);
            }
            catch (error) {
                document.getElementById("content-panel").textContent =
                    "Error loading data: " + error.message;
            }
        }
    </script>

</body>

</html>
